name: Validate Skill Builder

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: skill-builder
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependency
        run: python -m pip install -r skill-builder/requirements-dev.txt
      - name: Run static Skill audit
        run: python skill-builder/scripts/audit_skill.py skill-builder --portable
      - name: Run auditor regression tests
        run: python skill-builder/scripts/test_audit_skill.py
